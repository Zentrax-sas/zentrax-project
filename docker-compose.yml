version: '3.8'

services:
  # 1. Servidor Web Nginx
  web:
    image: nginx:alpine
    container_name: zemyna_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - db

  # 2. Procesador PHP
  php:
    image: php:8.2-fpm
    container_name: zemyna_php
    restart: always
    volumes:
      - .:/var/www/html

  # 3. Base de Datos MariaDB / MySQL
  db:
    image: mariadb:latest
    container_name: zemyna_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: nombre_base_datos
      MYSQL_USER: usuario_db
      MYSQL_PASSWORD: usuario_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 4. phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: zemyna_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root_password

volumes:
  db_data: