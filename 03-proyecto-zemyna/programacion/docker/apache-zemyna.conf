<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    # Preserve existing relative URLs; never expose the project directory index.
    RedirectMatch 302 "^/$" "/frontend/public/index.html"
    RedirectMatch 302 "^/frontend/?$" "/frontend/public/index.html"

    # Deny by default, including config, SQL, tests, uploads and session logs.
    <Directory "/var/www/html">
        AllowOverride None
        Options -Indexes -MultiViews -ExecCGI -Includes
        Require all denied
    </Directory>

    <Directory "/var/www/html/frontend/public">
        DirectoryIndex index.html
        AddDefaultCharset UTF-8
        AddCharset UTF-8 .html .css .js
        Require all denied
        <FilesMatch "(?i)^[^.].*\.(?:html|css|js|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|otf)$">
            Require all granted
        </FilesMatch>
    </Directory>

    # Existing public pages reference ../src/styles/*.css.
    <Directory "/var/www/html/frontend/src/styles">
        Require all denied
        <FilesMatch "(?i)^[^.].*\.css$">
            Require all granted
        </FilesMatch>
    </Directory>

    # Only entry scripts are callable; PHP internals remain filesystem-private.
    <Directory "/var/www/html/backend/api">
        Require all denied
        AcceptPathInfo Off
        <FilesMatch "^[A-Za-z0-9_-]+\.php$">
            Require all granted
        </FilesMatch>
    </Directory>

    # Also reject backups, hidden files and double-extension private files.
    <LocationMatch "(?i)(?:^|/)\.|\.(?:env|sql|md|log|ini|conf|ya?ml|json|xml|bak|old|orig|tmp|swp|phar|phps|phtml|php[0-9]+)(?:\.|$)|\.php\.">
        Require all denied
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
